# Moves the `stable` channel to an image that has been validated on a real GPU
# (e.g. a reference render on a real GPU). `latest` is automatic; `stable` never is.
name: promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable tag to promote, e.g. 0.37.2-cu130-r1a2b3c4d"
        required: true
      channel:
        description: "Channel tag to move"
        default: stable

permissions: {}   # granted per job

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/diffusion-runtime"
          variant=$(cut -d- -f2 <<<"$TAG")
          tags=(-t "$image:$CHANNEL-$variant")
          if [[ "$(jq -r --arg v "$variant" '.[] | select(.variant==$v) | .default' variants.json)" == "true" ]]; then
            tags+=(-t "$image:$CHANNEL")
          fi
          docker buildx imagetools create "${tags[@]}" "$image:$TAG"
          echo "$CHANNEL -> $TAG" >> "$GITHUB_STEP_SUMMARY"
