# Rebuilds the image whenever (a) ComfyUI publishes a new vX.Y.Z tag or
# (b) the recipe here changes (Dockerfile, nodes.lock.yaml, models.lock.yaml, scripts, variants).
# Tag = <comfyui>-<variant>-r<recipe-hash>. If it already exists, nothing runs.
name: build

on:
  schedule:
    - cron: "23 */6 * * *"          # poll upstream every 6h
  push:
    branches: [main]
    paths: [Dockerfile, nodes.lock.yaml, models.lock.yaml, required_nodes.txt, variants.json, "scripts/**", "docker/**", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      comfyui_ref:
        description: "ComfyUI tag to build (empty = latest release tag)"
        required: false
      force:
        description: "Rebuild even if the tag already exists"
        type: boolean
        default: false

permissions: {}   # granted per job

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/Comfy-Org/ComfyUI.git

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      comfyui_ref: ${{ steps.plan.outputs.comfyui_ref }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        env:
          INPUT_REF: ${{ inputs.comfyui_ref }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/diffusion-runtime"
          ref="${INPUT_REF:-$(git ls-remote --tags --refs "$UPSTREAM" \
                 | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)}"
          echo "upstream ref: $ref"
          todo='[]'
          mapfile -t rows < <(jq -c '.[]' variants.json)
          for row in "${rows[@]}"; do
            variant=$(jq -r .variant <<<"$row")
            hash=$(scripts/recipe_hash.sh "$variant")
            tag="${ref#v}-${variant}-r${hash}"
            if [[ "$FORCE" != "true" ]] && docker buildx imagetools inspect "$image:$tag" >/dev/null 2>&1; then
              echo "exists: $tag (skip)"; continue
            fi
            echo "build:  $tag"
            todo=$(jq -c --argjson r "$row" --arg tag "$tag" --arg hash "$hash" \
                   '. + [$r + {tag: $tag, hash: $hash}]' <<<"$todo")
          done
          {
            echo "matrix=$(jq -c '{include: .}' <<<"$todo")"
            echo "any=$([[ "$todo" != "[]" ]] && echo true || echo false)"
            echo "comfyui_ref=$ref"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.any == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    env:
      IMAGE: ${{ needs.resolve.outputs.image }}
      REF: ${{ needs.resolve.outputs.comfyui_ref }}
      CANDIDATE: ${{ needs.resolve.outputs.image }}:candidate-${{ matrix.tag }}
    steps:
      # The hosted runner has ~14 GB free; torch+CUDA wheels alone are ~6 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.CANDIDATE }}
          build-args: |
            COMFYUI_REF=${{ env.REF }}
            TORCH_VERSION=${{ matrix.torch }}
            CUDA_TAG=${{ matrix.variant }}
            PYTHON_VERSION=${{ matrix.python }}
            RECIPE_HASH=${{ matrix.hash }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }},mode=max
          provenance: false
          # The commit the image was built from; promote uses it as the release target.
          labels: org.opencontainers.image.revision=${{ github.sha }}

      # No GPU on hosted runners: boot ComfyUI on CPU, check imports + required nodes.
      - name: Smoke test (CPU)
        run: docker run --rm --entrypoint python "$CANDIDATE" /opt/comfy/smoke.py

      - name: Publish tags
        run: |
          ver="${REF#v}"; v="${{ matrix.variant }}"
          tags=(-t "$IMAGE:${{ matrix.tag }}" -t "$IMAGE:$ver-$v" -t "$IMAGE:latest-$v")
          if [[ "${{ matrix.default }}" == "true" ]]; then
            tags+=(-t "$IMAGE:$ver" -t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$CANDIDATE"
          digest=$(docker buildx imagetools inspect "$IMAGE:${{ matrix.tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### ${{ matrix.tag }}"
            echo "- ComfyUI \`$REF\`, torch \`${{ matrix.torch }}+$v\`"
            echo "- Pin by digest: \`$IMAGE@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
