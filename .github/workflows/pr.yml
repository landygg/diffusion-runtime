# Required check for every PR into main (Renovate included): build the default
# variant and run the smoke test. Never pushes. Runs with a read-only token and
# no secrets, which is what GitHub gives PRs from forks anyway.
name: pr

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: v
        run: |
          jq -r '.[] | select(.default) | "variant=\(.variant)\ntorch=\(.torch)\npython=\(.python)"' variants.json >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: runtime:pr
          build-args: |
            TORCH_VERSION=${{ steps.v.outputs.torch }}
            CUDA_TAG=${{ steps.v.outputs.variant }}
            PYTHON_VERSION=${{ steps.v.outputs.python }}
          # Read-only use of the public cache; PRs never write it.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/diffusion-runtime:buildcache-${{ steps.v.outputs.variant }}
      - name: Smoke test (CPU)
        run: docker run --rm --entrypoint python runtime:pr /opt/comfy/smoke.py
