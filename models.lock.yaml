# Models downloaded to the volume ($COMFY_DATA_DIR/models/<folder>/). Never baked
# into the image: this file only says WHAT to fetch, pinned so every pod gets
# byte-identical weights. `sync-models` downloads what is missing and verifies
# sha256; `get-model <ref>` prints a ready-to-paste entry for a new model.
#
# Fields: group (selectable via COMFY_MODELS_GROUPS / `sync-models <group>`),
#         repo (Hugging Face model repo), revision (full commit SHA, never a branch),
#         file (path inside the repo), folder (ComfyUI model folder),
#         sha256 + size (from the Hub's LFS metadata), optional: name (rename on disk)
#
# Upstream licenses: Z-Image Turbo and Wan 2.2 are Apache-2.0 (see each repo).
